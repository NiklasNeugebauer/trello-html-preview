name: Build and attach to release

# Publishing a GitHub release tagged vX.Y.Z builds both browsers at that version:
# Firefox is signed as an unlisted add-on on addons.mozilla.org and attached together with
# the updates.json its update_url reads; Chrome is attached as a zip for "Load unpacked".

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "NAME=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          VERSION="${TAG#v}" ./build.sh

      - name: Sign Firefox add-on on addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx --yes web-ext@10.8.0 sign --source-dir dist/firefox --channel unlisted --artifacts-dir web-ext-artifacts

      - name: Package Chrome extension
        run: (cd dist/chrome && zip -qr "../../$NAME-chrome-$VERSION.zip" .)

      - name: Attach to release
        run: |
          xpi="$NAME-firefox-$VERSION.xpi"
          mv web-ext-artifacts/*.xpi "$xpi"
          addon_id=$(jq -r .browser_specific_settings.gecko.id dist/firefox/manifest.json)
          jq -n --arg id "$addon_id" --arg v "$VERSION" \
            --arg link "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$xpi" \
            '{addons: {($id): {updates: [{version: $v, update_link: $link}]}}}' > updates.json
          gh release upload "$TAG" "$xpi" "$NAME-chrome-$VERSION.zip" updates.json --clobber
